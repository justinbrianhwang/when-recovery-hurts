[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "robot-hci-starter"
version = "0.3.0"
description = "Simulation-only harm-constrained robotic intervention research starter"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
hci = "hci.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
